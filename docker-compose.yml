services:

  frontend:
    # Pulled from ECR on the server (the t3.micro has 1 GiB RAM and bundling there
    # takes minutes); `docker compose build` still works locally.
    image: 286841103963.dkr.ecr.ap-southeast-2.amazonaws.com/cmaa-frontend:latest
    build: ./frontend
    restart: 'always'
    container_name: cloud-frontend
    # Only public-facing service. nginx terminates TLS with the Cloudflare origin cert.
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    networks:
      app-sso-network:
        ipv4_address: 172.27.0.11
    depends_on:
      - backend

  backend:
    image: 286841103963.dkr.ecr.ap-southeast-2.amazonaws.com/cmaa-backend:latest
    build: ./server
    restart: 'always'
    container_name: cloud-backend
    # Internal only — reached via http://cloud-backend:3000 from nginx. Not published.
    networks:
      app-sso-network:
        ipv4_address: 172.27.0.12
    volumes:
      # SQLite database — must persist across container rebuilds
      - sqlite-data:/usr/src/app/data
    environment:
      # Also used to build the NewebPay Notify/Return callback URLs, so it must be
      # the public HTTPS origin NewebPay can reach.
      - CLIENT_URL=${CLIENT_URL}
      # AWS S3 — durable store for uploaded binaries + report artifacts
      - AWS_REGION=${AWS_REGION}
      - S3_BUCKET=${S3_BUCKET}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      # Android static analysis — AWS Lambda Function URL (auth: NONE)
      - ANDROID_STATIC_API=${ANDROID_STATIC_API}
      # PDF reports — private Lambda, invoked with the SDK (no public endpoint).
      # Renders to S3 and returns a presigned URL, so PDFs never transit this box.
      - PDF_LAMBDA_NAME=${PDF_LAMBDA_NAME}
      # Dynamic analysis test accounts (server/secretbox.ts). 32-byte key, hex or
      # base64 — generate with: openssl rand -hex 32. Unset, credentials are
      # refused rather than stored in the clear and dynamic runs go without a
      # login; changed, everything already stored becomes unreadable.
      - DYNAMIC_CRED_KEY=${DYNAMIC_CRED_KEY:-}
      # Days a stored account is kept if its analysis is never run; 0 disables the
      # sweep. A completed run deletes its own regardless.
      - DYNAMIC_CRED_TTL_DAYS=${DYNAMIC_CRED_TTL_DAYS:-30}
      # Dynamic analysis ARM64 sandbox configuration (AWS Sydney VPC Private IP direct connect)
      - DYNAMIC_SANDBOX_INSTANCE_ID=${DYNAMIC_SANDBOX_INSTANCE_ID:-i-037917cfa6d87177f}
      - DYNAMIC_SANDBOX_HOST=${DYNAMIC_SANDBOX_HOST:-172.31.43.199}
      - DYNAMIC_SANDBOX_PORT=${DYNAMIC_SANDBOX_PORT:-5002}
      # NewebPay (藍新金流) — credit purchases. Replaced Stripe.
      # Gateway: https://ccore.newebpay.com (test) / https://core.newebpay.com (prod).
      # Credentials are environment-specific and are NOT interchangeable.
      - NEWEBPAY_MERCHANT_ID=${NEWEBPAY_MERCHANT_ID}
      - NEWEBPAY_HASH_KEY=${NEWEBPAY_HASH_KEY}
      - NEWEBPAY_HASH_IV=${NEWEBPAY_HASH_IV}
      - NEWEBPAY_GATEWAY=${NEWEBPAY_GATEWAY}
      # Pricing is denominated in USD; NewebPay charges TWD (MPG has no currency
      # field), so each order converts at a rate refreshed daily by server/fx.ts.
      # FALLBACK_TWD_PER_USD is only used if no rate has ever been fetched.
      - USD_PER_CREDIT=${USD_PER_CREDIT}
      - FALLBACK_TWD_PER_USD=${FALLBACK_TWD_PER_USD}
      # Credit audit (server/credit_audit.ts) — nightly snapshot of every balance,
      # reconciled against the credit ledger and the paid NewebPay orders behind it.
      # Credits seeded on signup; the audit enforces this exact figure.
      - SIGNUP_CREDITS=${SIGNUP_CREDITS:-0}
      - CREDIT_AUDIT_ENABLED=${CREDIT_AUDIT_ENABLED:-true}
      # Wall-clock time of the daily run, in the offset below (480 = UTC+8, Taipei).
      - CREDIT_AUDIT_TIME=${CREDIT_AUDIT_TIME:-03:30}
      - CREDIT_AUDIT_TZ_OFFSET_MIN=${CREDIT_AUDIT_TZ_OFFSET_MIN:-480}
      # Off by default: a bug in a credit path would otherwise delete real balances.
      - CREDIT_AUDIT_AUTO_CLAMP=${CREDIT_AUDIT_AUTO_CLAMP:-false}
      # Snapshot history kept; 0 disables. Never prunes the ledger, the anomaly
      # record, or any user's most recent snapshot.
      - CREDIT_AUDIT_RETENTION_DAYS=${CREDIT_AUDIT_RETENTION_DAYS:-180}
      - CREDIT_AUDIT_WEBHOOK_URL=${CREDIT_AUDIT_WEBHOOK_URL:-}
      # Guards /api/admin/credit-audit/*. Unset ⇒ those routes answer 503.
      - ADMIN_API_TOKEN=${ADMIN_API_TOKEN:-}

volumes:
  sqlite-data:

networks:
  app-sso-network:
    name: app-sso-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.27.0.0/16