# Edge nginx: TLS termination (Cloudflare origin cert) + SPA static + API reverse proxy

# Redirect plain HTTP to HTTPS (Cloudflare connects on 443, this is a safety net)
server {
    listen 80;
    server_name cmaa.solitesterror.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name cmaa.solitesterror.com;

    # Cloudflare Origin Certificate (15-year). See certs/ in repo root.
    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;

    # Match Cloudflare free-plan body cap; covers .ipa/.apk uploads
    client_max_body_size 100M;

    root /usr/share/nginx/html;
    index index.html;

    # Cloudflare Real IP Configuration
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # Backend API + upload/analysis endpoints -> Express backend (internal HTTP)
    location ~ ^/(api|upload|uploads|guest|check-hash|ios-static-analyze|android-static-analyze|android-dynamic-analyze|generate-report|retry|dynamic-credentials)(/|$) {
        proxy_pass http://cloud-backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP  $remote_addr;
        proxy_set_header Authorization     $http_authorization;
        # Long-running PDF generation / report endpoints
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SPA: serve static assets, fall back to index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
